name: instantjob-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instantjob
      POSTGRES_USER: instantjob
      POSTGRES_PASSWORD: test-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantjob -d instantjob"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
